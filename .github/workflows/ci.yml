name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/drap
      DATABASE_URL: postgresql://drap_app:drap_app@localhost:5432/drap
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DEFAULT_TENANT_SLUG: drap
      SEED_ADMIN_EMAIL: admin@exemplo.com.br
      SEED_ADMIN_PASSWORD: Admin@12345678
      SEED_DEMO_USERS: "1"
      SEED_DEMO_CONTENT: "1"
      COURSES_DIR: "content/cursos:tests/fixtures/cursos"
      AUTH_RATE_LIMIT: "off"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + regra de tokens)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrações (papel dono) e senha do papel da aplicação
        run: |
          DATABASE_URL=$DIRECT_URL npx prisma migrate deploy
          psql "$DIRECT_URL" -c "ALTER ROLE drap_app LOGIN PASSWORD 'drap_app';"
      - name: Seed
        run: npm run db:seed
      - name: Testes unitários e de integração (inclui RLS)
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
      - name: Testes E2E (desktop e celular, axe-core WCAG AA)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
